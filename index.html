<!DOCTYPE html>
<html lang="tr">

<head>

    <!-- Site İkonu (Favicon) -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOMOS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- MODÜLER CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/trade-dashboard.css">
    <link rel="stylesheet" href="css/parties/dashboard.css">
    <link rel="stylesheet" href="css/parties/modal.css">
    <link rel="stylesheet" href="css/parties/create.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="css/parliament/style.css">
</head>

<body>

    <!-- ÜST PANEL -->
    <header class="game-header">
        <div class="header-top">
            <!-- Profil -->
            <div class="user-section">
                <div class="avatar-frame">
                    <img src="https://i.pravatar.cc/150?img=11" alt="Avatar" id="user-avatar">
                    <span class="level-badge">LVL 12</span>
                </div>
                <div class="user-details">
                    <span class="username">Başkan [TR]</span>
                    <span class="user-title">Parti Lideri</span>
                </div>
            </div>

            <!-- Enerji ve Ayarlar -->
            <div class="status-section">
                <div class="resource-group">
                    <i class="fa-solid fa-coins text-gold"></i>
                    <span class="resource-value" id="global-gold">50,000</span>
                    <span class="label">Altın</span>
                </div>
                <div class="resource-group">
                    <i class="fa-solid fa-bolt text-yellow"></i>
                    <div class="bar-container">
                        <div class="bar-fill" style="width: 85%;" id="energy-bar"></div>
                        <span class="bar-text" id="energy-text">85 / 100</span>
                    </div>
                    <span class="label">Enerji</span>
                </div>
                <button class="settings-btn"><i class="fa-solid fa-gear"></i> Ayarlar</button>
            </div>
        </div>

        <!-- Navigasyon -->
        <nav class="header-bottom">
            <a href="#" data-page="home" class="active"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
            <a href="#" data-page="profile"><i class="fa-solid fa-user"></i> Profil</a>
            <a href="#" data-page="map"><i class="fa-solid fa-map"></i> Harita</a>
            <a href="#" data-page="parties"><i class="fa-solid fa-flag"></i> Partiler</a>
            <a href="#" data-page="parliament"><i class="fa-solid fa-landmark"></i> Meclis</a>
            <a href="#" data-page="trade"><i class="fa-solid fa-chart-line"></i> Ticaret</a>
            <a href="#" data-page="hangar"><i class="fa-solid fa-jet-fighter"></i> Hangar</a>
            <a href="#" data-page="messages"><i class="fa-solid fa-envelope"></i> Mesajlar</a>
            <a href="#" data-page="social"><i class="fa-brands fa-twitter"></i> Sosyal Medya</a>
        </nav>

        <!-- Yükleme Çubuğu (Separator ve Loading) -->
        <div class="loading-line-container">
            <div class="loading-progress-bar" id="global-progress-bar"></div>
        </div>
    </header>

    <!-- Ana Sahne -->
    <main id="app-container">
        <!-- İçerik dinamik gelecek -->
    </main>

    <!-- Leaflet JS (Global Kütüphane) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" ...></script>

    <!-- YENİ: Turf.js (Voronoi ve Geometri İşlemleri İçin) -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <!-- Cropper JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- MODÜLER JS BAŞLANGICI -->
    <script type="module" src="js/main.js?v=2"></script>
</body>

</html>
