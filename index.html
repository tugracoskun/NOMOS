<!DOCTYPE html>
<html lang="tr">

<head>

    <!-- Site İkonu (Favicon) -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOMOS</title>
    <link rel="stylesheet" href="libs/fontawesome/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- MODÜLER CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/trade-dashboard.css">
    <link rel="stylesheet" href="css/parties/dashboard.css">
    <link rel="stylesheet" href="css/parties/modal.css">
    <link rel="stylesheet" href="css/parties/create.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="css/parliament/style.css">
    <link rel="stylesheet" href="css/sidebar-menu.css">
    <link rel="stylesheet" href="css/index-popup.css">
    <link rel="stylesheet" href="css/city.css?v=3">
    <link rel="stylesheet" href="css/nation-panel.css">
    <link rel="stylesheet" href="css/hangar.css">
</head>

<body>

    <!-- ÜST PANEL -->
    <header class="game-header">
        <div class="header-top">
            <!-- Profil & Enerji Status Card -->
            <div class="user-profile-status" data-page="profile" style="cursor: pointer;" title="Profili Görüntüle">
                <div class="avatar-container">
                    <div class="avatar-glow"></div>
                    <img src="https://i.pravatar.cc/150?img=11" alt="Avatar" id="user-avatar">
                    <div class="level-indicator">12</div>
                </div>
                <div class="user-info-area">
                    <div class="user-meta">
                        <span class="username">Başkan [TR]</span>
                    </div>
                    <div class="energy-container-mini">
                        <div class="energy-bar-bg">
                            <div class="energy-bar-fill" style="width: 85%;" id="energy-bar"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Enerji, Arama ve Ayarlar -->
            <div class="status-section">
                <!-- Mesajlar İkonu -->
                <div class="header-messages-icon" data-page="messages" style="cursor: pointer; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 6px; transition: all 0.3s; position: relative;" title="Mesajlar">
                    <i class="fa-solid fa-envelope" style="color: var(--text-light); font-size: 0.9rem;"></i>
                    <span class="msg-badge" style="position: absolute; top: -4px; right: -4px; background: #ef4444; color: white; font-size: 0.55rem; font-weight: bold; padding: 2px 4px; border-radius: 6px; box-shadow: 0 0 5px rgba(239,68,68,0.5); display: none;">0</span>
                </div>

                <div class="resource-group gold-display" onclick="toggleGoldDropdown(event)" style="cursor: pointer;">
                    <i class="fa-solid fa-coins text-gold"></i>
                    <span class="resource-value" id="global-gold">50,000</span>
                    <span class="label">ALTIN</span>
                </div>
                <button class="hamburger-btn" id="btn-hamburger" aria-label="Menü">
                    <span class="ham-line"></span>
                    <span class="ham-line"></span>
                    <span class="ham-line"></span>
                </button>
            </div>
        </div>

        <!-- Navigasyon -->
        <!-- Navigasyon -->
        <nav class="header-bottom">
            <a href="#" data-page="home" class="active"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
            <a href="#" data-page="map"><i class="fa-solid fa-map"></i> Harita</a>
            <a href="#" data-page="wars"><i class="fa-solid fa-jet-fighter"></i> Savaşlar</a>
            <a href="#" data-page="parties"><i class="fa-solid fa-flag"></i> Partiler</a>
            <a href="#" data-page="trade"><i class="fa-solid fa-chart-line"></i> Ticaret</a>
            <a href="#" data-page="hangar"><i class="fa-solid fa-warehouse"></i> Hangar</a>
            <a href="#" data-page="social"><i class="fa-brands fa-twitter"></i> Sosyal Medya</a>
        </nav>

        <!-- Yükleme Çubuğu (Separator ve Loading) -->
        <div class="loading-line-container">
            <div class="loading-progress-bar" id="global-progress-bar"></div>
        </div>
    </header>

    <!-- Ana Sahne -->
    <main id="app-container">
        <!-- İçerik dinamik gelecek -->
    </main>

    <!-- Leaflet JS (Global Kütüphane) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" ...></script>

    <!-- YENİ: Turf.js (Voronoi ve Geometri İşlemleri İçin) -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <!-- Cropper JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- MODÜLER JS BAŞLANGICI -->
    <script type="module" src="js/main.js?v=2"></script>
</body>

</html>
